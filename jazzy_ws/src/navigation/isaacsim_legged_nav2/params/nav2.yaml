# Nav2 for a legged robot in Isaac Sim (legged_ros2_sim.py), Ouster OS0 on its back. Shared by all
# robots: per-robot values (footprint, self-filter ranges, goal tolerances, controller speed floors)
# come from params/robot_profiles.yaml.
#
# Frames: odom and base_footprint lie on the floor; base_link is the robot's body, which bobs and
# tilts while walking. Everything Nav2 treats as "the robot" uses base_footprint, so every
# height below is measured from the floor.
#
# $(var ...) values are filled in by nav2_stack.launch.xml.

amcl:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: OS0/scan_localization
    map_topic: map
    robot_model_type: "nav2_amcl::OmniMotionModel"  # both robots strafe
    alpha1: 0.02
    alpha2: 0.02
    alpha3: 0.02
    alpha4: 0.02
    alpha5: 0.02
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_min_range: $(var scan_range_min)
    laser_max_range: 50.0
    max_beams: 360
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    tf_broadcast: true
    transform_tolerance: 2.0
    update_min_a: 0.2
    update_min_d: 0.25
    save_pose_rate: 0.5
    set_initial_pose: True
    initial_pose:
      x: $(var initial_x)
      y: $(var initial_y)
      z: 0.0
      yaw: $(var initial_yaw)
    always_reset_initial_pose: false
    first_map_only: false

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001  # must be small: the robots report real sideways motion
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath", "Stairs"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.5
      required_movement_angle: 0.25
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # per robot (robot_profiles.yaml): Spot can't place itself finely, ANYmal-D can
      xy_goal_tolerance: $(var xy_goal_tolerance)
      yaw_goal_tolerance: $(var yaw_goal_tolerance)
    # Regulated Pure Pursuit, not MPPI: measured on Spot, MPPI kept commanding ~0.5 m/s at 0.4 m
    # from the goal and overshot by ~1 m every time (Spot responds with lag, and it ignores very
    # small commands from a stand). RPP decelerates explicitly toward the goal, holds a per-robot
    # speed floor (above Spot's deadband), and turns in place for the final heading.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.6
      lookahead_dist: 0.6
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.0
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.1
      min_approach_linear_velocity: $(var min_approach_velocity)
      approach_velocity_scaling_dist: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      # Floor in tight turns, for both robots: above Spot's deadband, and fast enough for the progress
      # checker (0.5 m in 10 s) through doorways (ANYmal-D at 0.1 m/s here tripped it).
      regulated_linear_scaling_min_speed: 0.3
      use_cost_regulated_linear_velocity_scaling: false
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: $(var rotate_to_heading_angular_vel)
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 2.0
      allow_reversing: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      interpolate_curvature_after_goal: false
      use_fixed_curvature_lookahead: false
    Stairs:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.25
      lookahead_dist: 0.6
      use_collision_detection: false
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.8, 0.5, 1.0]
    min_velocity: [-0.5, -0.5, -1.0]
    max_accel: [1.5, 1.5, 2.0]
    max_decel: [-1.5, -1.5, -2.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      # 2.5 cm: a door frame is marked at most one cell inside its true position. At 5 cm ANYmal-D's
      # footprint check clipped the frames of 0.88-0.94 m office doors and the controller gave up.
      resolution: 0.025
      transform_tolerance: 0.3
      footprint: $(var footprint)  # a quoted string, see navigation.launch.py
      footprint_padding: $(var local_footprint_padding)
      always_send_full_costmap: True
      plugins: ["os0_voxel_layer", "inflation_layer", "static_map_layer"]
      static_map_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.6  # >= circumscribed radius (Spot 0.644 m, ANYmal-D 0.663 m)
      os0_voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        footprint_clearing_enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.125
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 2
        unknown_threshold: 15
        combination_method: 1
        observation_sources: pointcloud
        pointcloud:
          topic: $(var pointcloud_topic)
          data_type: "PointCloud2"
          clearing: True
          marking: True
          min_obstacle_height: 0.15  # above the floor (odom lies on the floor)
          max_obstacle_height: 2.0
          # Distance from the sensor: drops the robot's own legs and back, and the (0,0,0)
          # no-return points Isaac's RTX lidar emits.
          obstacle_min_range: $(var self_filter_range)
          obstacle_max_range: 5.0
          raytrace_min_range: $(var self_filter_range)
          raytrace_max_range: 6.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      footprint: $(var footprint)  # a quoted string, see navigation.launch.py
      footprint_padding: $(var global_footprint_padding)
      always_send_full_costmap: True
      plugins: ["static_layer", "os0_voxel_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      os0_voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        footprint_clearing_enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.125
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 2
        unknown_threshold: 15
        combination_method: 1
        observation_sources: pointcloud
        pointcloud:
          topic: $(var pointcloud_topic)
          data_type: "PointCloud2"
          clearing: True
          marking: True
          min_obstacle_height: 0.15  # above the floor (odom lies on the floor)
          max_obstacle_height: 2.0
          # Distance from the sensor: drops the robot's own legs and back, and the (0,0,0)
          # no-return points Isaac's RTX lidar emits.
          obstacle_min_range: $(var self_filter_range)
          obstacle_max_range: 5.0
          raytrace_min_range: $(var self_filter_range)
          raytrace_max_range: 6.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.6

collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 3.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    # The flattened scan, not the raw cloud: a 1.3 MB cloud over a BEST_EFFORT subscription
    # can starve this node (see isaacsim_clearpath_nav2). range_min already drops self hits.
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: $(var collision_scan_topic)
      enabled: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5000
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"  # both walk backward (trained down to -2 m/s and -1 m/s)
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.0

docking_server:
  ros__parameters:
    use_sim_time: True
    base_frame: "base_footprint"
    fixed_frame: "odom"
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
    controller:
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
